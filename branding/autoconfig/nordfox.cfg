// NordFox autoconfig
// First line MUST be a comment — the autoconfig parser skips it.
// Installed into <app>/Contents/Resources/nordfox.cfg.
// Runs in chrome scope at startup, before any UI is shown.

(function () {
  try {
    // Locate the bundled retro homepage inside the .app:
    //   <app>/Contents/Resources/nordfox-homepage.html
    // XREExeF = .../NordFox.app/Contents/MacOS/<exec>
    // .parent.parent = .../NordFox.app/Contents
    let exe = Services.dirsvc.get("XREExeF", Ci.nsIFile);
    let contents = exe.parent.parent;
    let resourceUrl = function (name) {
      let f = contents.clone();
      f.append("Resources");
      f.append(name);
      return f.exists() ? Services.io.newFileURI(f).spec : null;
    };

    let homepageUrl = resourceUrl("nordfox-homepage.html");
    if (homepageUrl === null) {
      // Bundled page missing — give up silently so the browser still works.
      return;
    }

    // Default-pref so user.js (per-profile) can still override.
    let defaults = Services.prefs.getDefaultBranch(null);
    defaults.setStringPref("browser.startup.homepage", homepageUrl);
    defaults.setIntPref("browser.startup.page", 1);

    // Cmd+T gets the dedicated light new-tab page; fall back to the
    // homepage if the newtab bundle is missing (pre-newtab builds).
    let newtabUrl = resourceUrl("nordfox-newtab.html");
    let AboutNewTab = ChromeUtils.importESModule(
      "resource:///modules/AboutNewTab.sys.mjs"
    ).AboutNewTab;
    AboutNewTab.newTabURL = newtabUrl !== null ? newtabUrl : homepageUrl;
  } catch (e) {
    // eslint-disable-next-line no-undef
    Cu.reportError("NordFox autoconfig error: " + e);
  }
})();
