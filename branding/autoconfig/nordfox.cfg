// NordFox autoconfig
// First line MUST be a comment — the autoconfig parser skips it.
// Installed next to the browser runtime on Windows/Linux and inside
// <app>/Contents/Resources on macOS.
// Runs in chrome scope at startup, before any UI is shown.

(function () {
  try {
    // Locate bundled resources on every desktop platform. Windows/Linux put
    // them next to the executable; macOS puts them in Contents/Resources.
    let exe = Services.dirsvc.get("XREExeF", Ci.nsIFile);
    let runtime = exe.parent;
    let resources = [runtime];
    if (runtime.parent !== null) {
      let macResources = runtime.parent.clone();
      macResources.append("Resources");
      resources.push(macResources);
    }
    let resourceFile = function (name) {
      for (let root of resources) {
        let f = root.clone();
        f.append(name);
        if (f.exists()) {
          return f;
        }
      }
      return null;
    };
    let resourceUrl = function (name) {
      let f = resourceFile(name);
      return f !== null ? Services.io.newFileURI(f).spec : null;
    };

    let homepageUrl = resourceUrl("nordfox-homepage.html");
    if (homepageUrl === null) {
      // Bundled page missing — give up silently so the browser still works.
      return;
    }

    // Default-pref so user.js (per-profile) can still override.
    let defaults = Services.prefs.getDefaultBranch(null);
    defaults.setStringPref("browser.startup.homepage", homepageUrl);
    defaults.setIntPref("browser.startup.page", 1);

    // Cmd+T gets the dedicated light new-tab page; fall back to the
    // homepage if the newtab bundle is missing (pre-newtab builds).
    let newtabUrl = resourceUrl("nordfox-newtab.html");
    let AboutNewTab = ChromeUtils.importESModule(
      "resource:///modules/AboutNewTab.sys.mjs"
    ).AboutNewTab;
    AboutNewTab.newTabURL = newtabUrl !== null ? newtabUrl : homepageUrl;

    // Install the NordFox chrome theme into a fresh profile without replacing
    // CSS files the user already owns. Firefox reads these on the next start.
    let profile = Services.dirsvc.get("ProfD", Ci.nsIFile);
    let chrome = profile.clone();
    chrome.append("chrome");
    if (!chrome.exists()) {
      chrome.create(Ci.nsIFile.DIRECTORY_TYPE, 0o700);
    }
    for (let pair of [
      ["nordfox-userChrome.css", "userChrome.css"],
      ["nordfox-userContent.css", "userContent.css"],
    ]) {
      let source = resourceFile(pair[0]);
      let target = chrome.clone();
      target.append(pair[1]);
      if (source !== null && !target.exists()) {
        source.copyTo(chrome, pair[1]);
      }
    }
    defaults.setBoolPref(
      "toolkit.legacyUserProfileCustomizations.stylesheets",
      true
    );
  } catch (e) {
    // eslint-disable-next-line no-undef
    Cu.reportError("NordFox autoconfig error: " + e);
  }
})();
